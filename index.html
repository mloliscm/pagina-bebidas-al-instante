<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bebidas al Instante Lolis</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="contenedor">

    <div class="logo">
      <img src="img/logo-lolis.png" alt="Bebidas al Instante Lolis">
    </div>

    <div class="login">
      <h2>Iniciar sesión</h2>

      <form onsubmit="iniciarSesion(event)">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" placeholder="Ingresa tu usuario">

        <label for="password">Contraseña</label>
        <div class="password">
          <input type="password" id="password" placeholder="Ingresa tu contraseña">
          <button type="button" onclick="mostrarPassword()">👁️</button>
        </div>

        <button class="btn-login" type="submit">Iniciar sesión</button>
      </form>

      <p id="mensaje"></p>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>

    <script src="script.js"></script>
</body>
</html>
